<!doctype html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141414">
<title>Քարի կատալոգ · ՔԱՐԱՐՎԵՍՏ STONES</title>
<meta name="description" content="Գրանիտ, մարմար և քվարց՝ ՔԱՐԱՐՎԵՍՏ STONES">
<meta property="og:title" content="Քարի կատալոգ · ՔԱՐԱՐՎԵՍՏ STONES">
<meta property="og:description" content="Գրանիտ, մարմար և քվարց">
<meta property="og:type" content="website">
<meta property="og:image" content="https://sargsian97.github.io/granite-avenue-catalog/logo/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<link rel="icon" href="logo/icon.png">
<link rel="apple-touch-icon" href="logo/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&family=Noto+Sans+Armenian:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#141414; --bg2:#1d1c1a; --stone:#48443f; --beige:#b3a395; --ivory:#ece5dc; --muted:#8a8178;
  --line:rgba(179,163,149,.2);
  --ease-out:cubic-bezier(.23,1,.32,1);
  --hy:"Noto Sans Armenian","Montserrat",-apple-system,system-ui,sans-serif;
  --lat:"Montserrat","Noto Sans Armenian",-apple-system,system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0}
html{background:var(--bg);-webkit-text-size-adjust:100%;scroll-behavior:smooth}
html.lock{overflow:hidden}
body{background:var(--bg);color:var(--ivory);font-family:var(--hy);-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}

/* cover */
.cover{min-height:88svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:calc(env(safe-area-inset-top) + 48px) 24px 40px;
  background:radial-gradient(110% 70% at 50% 32%,#24221f 0%,var(--bg) 72%)}
.seal{width:min(60vw,260px);height:auto;animation:rise 900ms var(--ease-out) both}
.cover h1{margin-top:34px;font:300 30px/1.2 var(--hy);letter-spacing:.06em;animation:rise 900ms 120ms var(--ease-out) both}
.counts{margin-top:14px;font:400 11.5px/1.7 var(--hy);letter-spacing:.22em;text-transform:uppercase;color:var(--beige);
  animation:rise 900ms 200ms var(--ease-out) both}
.hint{margin-top:26px;font-size:13px;line-height:1.5;color:var(--muted);animation:rise 900ms 280ms var(--ease-out) both}
.cue{margin-top:30px;width:44px;height:44px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;
  color:var(--beige);transition:transform 160ms ease-out;animation:rise 900ms 360ms var(--ease-out) both}
.cue:active{transform:scale(.94)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}

/* sticky bar */
.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:calc(env(safe-area-inset-top) + 8px) 14px 8px;background:rgba(20,20,20,.84);
  -webkit-backdrop-filter:blur(14px) saturate(1.2);backdrop-filter:blur(14px) saturate(1.2);border-bottom:1px solid var(--line)}
.bar-logo img{height:30px;width:auto}
.chips{display:flex;gap:2px}
.chips a{font:400 11px/1 var(--hy);letter-spacing:.13em;text-transform:uppercase;color:var(--beige);padding:10px 7px;
  border-radius:999px;transition:background-color 160ms ease}
.chips a:active{background:rgba(179,163,149,.14)}
@media (max-width:359px){.bar-logo img{height:24px}.chips a{letter-spacing:.06em;padding:10px 5px}}

/* grid */
.wrap{max-width:1360px;margin:0 auto;padding:0 16px}
.sec{padding-top:40px;scroll-margin-top:52px}
.sec-h{display:flex;align-items:center;gap:14px;margin-bottom:22px;font:400 12.5px/1 var(--hy);letter-spacing:.24em;
  text-transform:uppercase;color:var(--beige)}
.sec-h::before,.sec-h::after{content:"";flex:1;height:1px;background:var(--line)}
.sec-h small{font-size:11px;letter-spacing:.1em;color:var(--muted);font-variant-numeric:tabular-nums}
.tiles{list-style:none;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 12px}
.tile{all:unset;display:block;width:100%;cursor:pointer;-webkit-tap-highlight-color:transparent}
.tile-img{display:block;aspect-ratio:4/5;overflow:hidden;border-radius:3px;background:var(--bg2);transition:transform 160ms ease-out}
.tile:active .tile-img{transform:scale(.97)}
.tile:focus-visible .tile-img{outline:1px solid var(--beige);outline-offset:3px}
.tile-img img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 400ms ease-out,transform 600ms var(--ease-out)}
.tile-img img.ok{opacity:1}
.tile-cap{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding-top:10px}
.tile-name{min-width:0;overflow-wrap:anywhere;font:400 11.5px/1.35 var(--lat);letter-spacing:.09em;text-transform:uppercase;color:var(--ivory)}
.tile-num{flex:none;font:400 11px/1 var(--lat);letter-spacing:.06em;color:var(--muted);font-variant-numeric:tabular-nums}
@media (min-width:640px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr));gap:30px 16px}.tile-name{font-size:12.5px}}
@media (min-width:960px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}.wrap{padding:0 32px}}
@media (min-width:1240px){.tiles{grid-template-columns:repeat(5,minmax(0,1fr))}}
@media (hover:hover) and (pointer:fine){.tile:hover .tile-img img{transform:scale(1.04)}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;height:48px;padding:0 20px;border-radius:4px;
  border:1px solid var(--line);font:500 12.5px/1 var(--hy);letter-spacing:.08em;color:var(--ivory);
  -webkit-tap-highlight-color:transparent;transition:transform 160ms ease-out,background-color 160ms ease}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--beige);border-color:var(--beige);color:#141414}
@media (hover:hover) and (pointer:fine){.btn:hover{background:rgba(179,163,149,.1)}.btn.primary:hover{background:#c2b3a6}}

/* footer */
.foot{margin-top:64px;padding:56px 24px calc(env(safe-area-inset-bottom) + 56px);border-top:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;text-align:center;
  background:radial-gradient(90% 80% at 50% 0%,#211f1c 0%,var(--bg) 70%)}
.foot-logo{width:min(70vw,300px);height:auto}
.foot-lead{margin-top:26px;font-size:14px;line-height:1.5;color:var(--beige)}
.foot-actions{margin-top:22px;display:grid;gap:10px;width:min(100%,340px)}

/* viewer */
.viewer{position:fixed;inset:0;z-index:50;background:var(--bg);opacity:0;transition:opacity 160ms ease-out}
.viewer.show{opacity:1;transition-duration:220ms}
.viewer[hidden]{display:none}
.v-top{position:absolute;top:0;left:0;right:0;z-index:3;display:flex;align-items:center;justify-content:space-between;
  padding:calc(env(safe-area-inset-top) + 8px) 12px 8px 18px;pointer-events:none}
.v-top>*{pointer-events:auto}
.v-count{font:400 12px/1 var(--lat);letter-spacing:.16em;color:var(--beige);font-variant-numeric:tabular-nums}
.v-close,.v-nav{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);
  background:rgba(20,20,20,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);cursor:pointer;
  -webkit-tap-highlight-color:transparent;transition:transform 160ms ease-out,opacity 160ms ease}
.v-close:active,.v-nav:active{transform:scale(.94)}
.track{position:absolute;inset:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;
  overscroll-behavior:contain;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;height:100%;min-width:0;scroll-snap-align:center;scroll-snap-stop:always;display:flex;flex-direction:column}
.photo{flex:1;min-height:0;padding-top:calc(env(safe-area-inset-top) + 60px)}
.photo img{width:100%;height:100%;object-fit:contain;opacity:0;transform:scale(.98);
  transition:opacity 300ms ease-out,transform 300ms var(--ease-out)}
.photo img.ok{opacity:1;transform:none}
.info{padding:22px 20px calc(env(safe-area-inset-bottom) + 22px)}
.v-meta{display:flex;align-items:center;gap:10px;font:400 11.5px/1 var(--hy);letter-spacing:.2em;text-transform:uppercase;color:var(--beige)}
.v-meta i{width:18px;height:1px;background:var(--beige);opacity:.6}
.v-name{margin-top:12px;font:300 26px/1.15 var(--lat);letter-spacing:.06em;text-transform:uppercase}
.v-actions{margin-top:20px;display:grid;grid-template-columns:1.5fr 1fr;gap:10px}
.v-note{margin-top:12px;font-size:12.5px;line-height:1.5;color:var(--muted)}
.v-nav{position:absolute;top:50%;z-index:3;display:none;margin-top:-22px}
.v-nav.prev{left:16px}.v-nav.next{right:16px}
.v-nav[disabled]{opacity:0;pointer-events:none}
@media (hover:hover) and (pointer:fine){.v-nav{display:grid}}
@media (min-width:900px) and (orientation:landscape){
  .slide{flex-direction:row;align-items:center}
  .photo{height:100%;padding:72px 24px 32px 84px}
  .info{flex:0 0 400px;padding:0 84px 0 16px}
  .v-name{font-size:34px}
  .v-actions{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .seal,.cover h1,.counts,.hint,.cue{animation:none}
  .photo img,.tile-img img{transform:none!important}
}
</style>
</head>
<body>

<header class="cover" id="top">
  <img class="seal" src="logo/seal.png" alt="ՔԱՐԱՐՎԵՍՏ STONES" width="640" height="640">
  <h1>Քարի կատալոգ</h1>
  <p class="counts" id="counts"></p>
  <p class="hint">Սեղմեք քարի վրա՝ մեծացնելու համար</p>
  <a class="cue" href="#grid" aria-label="Դեպի կատալոգ">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M7 2v10M2.5 7.5 7 12l4.5-4.5"/></svg>
  </a>
</header>

<nav class="bar" aria-label="Բաժիններ">
  <a class="bar-logo" href="#top"><img src="logo/wordmark.png" alt="ՔԱՐԱՐՎԵՍՏ STONES"></a>
  <div class="chips" id="chips"></div>
</nav>

<main class="wrap" id="grid"></main>

<footer class="foot" id="contacts">
  <img class="foot-logo" src="logo/wordmark.png" alt="ՔԱՐԱՐՎԵՍՏ STONES" loading="lazy">
  <p class="foot-lead">Գնի և առկայության համար գրեք մեզ</p>
  <div class="foot-actions">
    <a class="btn primary" id="fwrite" href="https://wa.me/37499989488" target="_blank" rel="noopener">WhatsApp</a>
    <a class="btn" href="tel:+37499989488">+374 99 989488</a>
    <a class="btn" href="https://instagram.com/qararvest.stones" target="_blank" rel="noopener">@qararvest.stones</a>
  </div>
</footer>

<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="Քար" hidden>
  <div class="v-top">
    <span class="v-count" id="vcount"></span>
    <button class="v-close" id="vclose" type="button" aria-label="Փակել">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2 2l10 10M12 2 2 12"/></svg>
    </button>
  </div>
  <div class="track" id="track"></div>
  <button class="v-nav prev" id="vprev" type="button" aria-label="Նախորդ">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M9 2 4 7l5 5"/></svg>
  </button>
  <button class="v-nav next" id="vnext" type="button" aria-label="Հաջորդ">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4"><path d="m5 2 5 5-5 5"/></svg>
  </button>
</div>

<script>
const STONES = [{"n": 1, "name": "Kashmir White", "type": "granite"}, {"n": 2, "name": "River White", "type": "granite"}, {"n": 3, "name": "Viscount White", "type": "granite"}, {"n": 4, "name": "Bianco Sardo", "type": "granite"}, {"n": 5, "name": "Bianco Antico", "type": "granite"}, {"n": 6, "name": "Alaska White", "type": "granite"}, {"n": 7, "name": "Delicatus White", "type": "granite"}, {"n": 8, "name": "Costa Esmeralda", "type": "granite"}, {"n": 9, "name": "Typhoon Green", "type": "granite"}, {"n": 10, "name": "Juparana Colombo", "type": "granite"}, {"n": 11, "name": "Panda Gold", "type": "granite"}, {"n": 12, "name": "Juparana India", "type": "granite"}, {"n": 13, "name": "Tropical Juparana", "type": "granite"}, {"n": 14, "name": "Lavender Blue", "type": "granite"}, {"n": 15, "name": "Multicolor Red", "type": "granite"}, {"n": 16, "name": "Paradiso Bash", "type": "granite"}, {"n": 17, "name": "Magma Gold", "type": "granite"}, {"n": 18, "name": "Tan Brown", "type": "granite"}, {"n": 19, "name": "Silver Paradiso", "type": "granite"}, {"n": 20, "name": "Paradiso Classico", "type": "granite"}, {"n": 21, "name": "Silver Cloud", "type": "granite"}, {"n": 22, "name": "Blue Pearl", "type": "granite"}, {"n": 23, "name": "Black Forest", "type": "granite"}, {"n": 24, "name": "Cosmic Black", "type": "granite"}, {"n": 25, "name": "Via Lattea", "type": "granite"}, {"n": 26, "name": "Snowflake Black", "type": "granite"}, {"n": 27, "name": "Black Pearl", "type": "granite"}, {"n": 28, "name": "Absolute Black", "type": "granite"}, {"n": 29, "name": "Black Galaxy", "type": "granite"}, {"n": 30, "name": "Bianco Carrara", "type": "marble"}, {"n": 31, "name": "Mugla White", "type": "marble"}, {"n": 32, "name": "Arabescato", "type": "marble"}, {"n": 33, "name": "Panda White", "type": "marble"}, {"n": 34, "name": "Crema Marfil", "type": "marble"}, {"n": 35, "name": "Verde Guatemala", "type": "marble"}, {"n": 36, "name": "Emperador Dark", "type": "marble"}, {"n": 37, "name": "Saint Laurent", "type": "marble"}, {"n": 38, "name": "Emperador Grey", "type": "marble"}, {"n": 39, "name": "Nero Marquina", "type": "marble"}, {"n": 40, "name": "Pure White", "type": "quartz"}, {"n": 41, "name": "Light Grey", "type": "quartz"}, {"n": 42, "name": "Dalmata", "type": "quartz"}, {"n": 43, "name": "Statuario", "type": "quartz"}, {"n": 44, "name": "Carrara", "type": "quartz"}, {"n": 45, "name": "Calacatta Venato", "type": "quartz"}, {"n": 46, "name": "Calacatta Classic", "type": "quartz"}, {"n": 47, "name": "Nero Marquina", "type": "quartz"}];
const TYPES = {granite: ["Գրանիտ", "գրանիտ"], marble: ["Մարմար", "մարմար"], quartz: ["Քվարց", "քվարց"]};
const WA = "37499989488", TEL = "+37499989488", IG = "qararvest.stones", FB = "qararvest.stones";

// The client writes where the link was sent. Instagram and Facebook/Messenger open links in their own browser and name
// themselves in the user agent; WhatsApp opens the phone's browser, so WhatsApp is the default. ?from=ig|fb|wa forces one.
const UA = navigator.userAgent;
const CH = {ig: "ig", fb: "fb", wa: "wa"}[new URLSearchParams(location.search).get("from")]
  || (/Instagram/i.test(UA) ? "ig" : /FBAN|FBAV|FB_IAB|FBIOS|Messenger/i.test(UA) ? "fb" : "wa");
const CHAT = {
  wa: {short: "WhatsApp", label: "Գրել WhatsApp-ով", url: m => `https://wa.me/${WA}` + (m ? `?text=${encodeURIComponent(m)}` : "")},
  ig: {short: "Instagram Direct", label: "Գրել Instagram-ով", url: () => `https://ig.me/m/${IG}`},  // Instagram takes no ready text
  fb: {short: "Messenger", label: "Գրել Messenger-ով", url: m => `https://m.me/${FB}` + (m ? `?text=${encodeURIComponent(m)}` : "")},
}[CH];
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, "0");
const esc = s => s.replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const fadeIn = im => im.complete && im.naturalWidth ? im.classList.add("ok") : im.addEventListener("load", () => im.classList.add("ok"), {once: true});

// grid, one section per stone type, in the order of stones.json
const used = Object.keys(TYPES).filter(t => STONES.some(s => s.type === t));
$("#counts").textContent = used.map(t => `${STONES.filter(s => s.type === t).length} ${TYPES[t][1]}`).join(" · ");
$("#chips").innerHTML = used.map(t => `<a href="#${t}">${TYPES[t][0]}</a>`).join("");
$("#grid").innerHTML = used.map(t => {
  const list = STONES.map((s, i) => ({...s, i})).filter(s => s.type === t);
  return `<section class="sec" id="${t}"><h2 class="sec-h"><span>${TYPES[t][0]}</span><small>${list.length}</small></h2>
    <ul class="tiles">${list.map(s => `<li><button class="tile" type="button" data-i="${s.i}" aria-label="№ ${pad(s.n)} ${esc(s.name)}">
      <span class="tile-img"><img src="img/t${pad(s.n)}.jpg" alt="" loading="lazy" decoding="async" width="600" height="750"></span>
      <span class="tile-cap"><span class="tile-name">${esc(s.name)}</span><span class="tile-num">${pad(s.n)}</span></span>
    </button></li>`).join("")}</ul></section>`;
}).join("");
document.querySelectorAll(".tile img").forEach(fadeIn);
$("#grid").addEventListener("click", e => { const b = e.target.closest(".tile"); if (b) open(+b.dataset.i, true); });

// viewer: one slide per stone, swiped by hand (native scroll-snap), photos load around the current one
const viewer = $("#viewer"), track = $("#track");
track.innerHTML = STONES.map(s => {
  const msg = `Բարև Ձեզ, ինձ հետաքրքրում է № ${pad(s.n)} քարը (${s.name})`;
  const attrs = CH === "wa" ? 'target="_blank" rel="noopener"' : `data-copy="${esc(msg)}"`;
  const note = CH === "wa" ? "Գնի և առկայության համար գրեք մեզ" : `Գնի և առկայության համար գրեք մեզ՝ նշելով № ${pad(s.n)}`;
  return `<article class="slide" aria-label="№ ${pad(s.n)} ${esc(s.name)}">
    <figure class="photo"><img data-src="img/${pad(s.n)}.jpg" alt="${esc(s.name)}"></figure>
    <div class="info">
      <p class="v-meta">№ ${pad(s.n)}<i></i>${TYPES[s.type][0]}</p>
      <h3 class="v-name">${esc(s.name)}</h3>
      <div class="v-actions">
        <a class="btn primary" href="${esc(CHAT.url(msg))}" ${attrs}>${CHAT.label}</a>
        <a class="btn" href="tel:${TEL}">Զանգել</a>
      </div>
      <p class="v-note">${note}</p>
    </div></article>`;
}).join("");
const slides = [...track.children];
// Instagram/Messenger: put the ready text on the clipboard too, so the client can paste it (best effort)
track.addEventListener("click", e => {
  const a = e.target.closest("a[data-copy]");
  if (a && navigator.clipboard) navigator.clipboard.writeText(a.dataset.copy).catch(() => {});
});
const fw = $("#fwrite");
fw.href = CHAT.url(""); fw.textContent = CHAT.short;
if (CH !== "wa") { fw.removeAttribute("target"); fw.removeAttribute("rel"); }
let cur = 0, pushed = false, hideTimer, raf;

function load(i) {
  for (let k = i - 1; k <= i + 2; k++) {
    const im = slides[k] && slides[k].querySelector("img");
    if (im && !im.getAttribute("src")) { im.src = im.dataset.src; fadeIn(im); }
  }
}
function setIndex(i) {
  cur = i;
  $("#vcount").textContent = `${pad(i + 1)} / ${STONES.length}`;
  $("#vprev").disabled = i === 0; $("#vnext").disabled = i === STONES.length - 1;
  load(i);
  history.replaceState(history.state, "", "#" + pad(i + 1));
}
function open(i, push) {
  clearTimeout(hideTimer);
  document.documentElement.classList.add("lock");
  viewer.hidden = false;
  if (push) { history.pushState({viewer: 1}, "", "#" + pad(i + 1)); pushed = true; }
  track.scrollLeft = i * track.clientWidth;
  setIndex(i);
  void viewer.offsetWidth;  // commit opacity 0 first so the fade runs (rAF may not fire on a page that is still loading)
  viewer.classList.add("show");
  $("#vclose").focus({preventScroll: true});
}
function close(fromHistory) {
  if (viewer.hidden) return;
  if (!fromHistory && pushed) { history.back(); return; }  // popstate comes back here
  pushed = false;
  if (!fromHistory) history.replaceState(null, "", location.pathname + location.search);
  viewer.classList.remove("show");
  document.documentElement.classList.remove("lock");
  const tile = document.querySelector(`.tile[data-i="${cur}"]`);
  if (tile) { tile.scrollIntoView({block: "center", behavior: "instant"}); tile.focus({preventScroll: true}); }
  hideTimer = setTimeout(() => { viewer.hidden = true; }, 170);
}
function go(i, smooth) {
  if (i < 0 || i >= STONES.length) return;
  track.scrollTo({left: i * track.clientWidth, behavior: smooth ? "smooth" : "instant"});
}
track.addEventListener("scroll", () => {
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(() => {
    if (viewer.hidden || !track.clientWidth) return;  // a hidden track reports width 0 and resets its scroll
    const i = Math.min(STONES.length - 1, Math.max(0, Math.round(track.scrollLeft / track.clientWidth)));
    if (i !== cur) setIndex(i);
  });
}, {passive: true});
addEventListener("resize", () => { if (!viewer.hidden) track.scrollLeft = cur * track.clientWidth; });
addEventListener("popstate", () => close(true));
$("#vclose").addEventListener("click", () => close(false));
$("#vprev").addEventListener("click", () => go(cur - 1, true));
$("#vnext").addEventListener("click", () => go(cur + 1, true));
addEventListener("keydown", e => {
  if (viewer.hidden) return;
  if (e.key === "Escape") close(false);
  else if (e.key === "ArrowRight") go(cur + 1, false);
  else if (e.key === "ArrowLeft") go(cur - 1, false);
});

// a link ending in #07 opens that stone
const m = location.hash.match(/^#(\d{2})$/);
if (m && +m[1] >= 1 && +m[1] <= STONES.length) open(+m[1] - 1, false);
</script>
</body>
</html>
